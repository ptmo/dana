<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debt Manager Pro</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Variabel Neumorphism & Tema */
        :root {
            --bg-color: #e0e5ec;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent: #0984e3;
            --danger: #d63031;
            
            --shadow-outset: 9px 9px 16px rgba(163, 177, 198, 0.6), 
                            -9px -9px 16px rgba(255, 255, 255, 0.5);
            --shadow-inset: inset 6px 6px 10px 0 rgba(163, 177, 198, 0.7), 
                           inset -6px -6px 10px 0 rgba(255, 255, 255, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile First Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px; /* Space for bottom nav */
            box-shadow: var(--shadow-outset);
        }

        /* Header */
        header {
            padding: 30px 20px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        /* Views */
        .view {
            display: none;
            padding: 0 20px;
            animation: fadeIn 0.4s ease;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Neumorphic Components */
        .card {
            background-color: var(--bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow-outset);
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        .card h2 {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 10px;
        }

        .card .amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 5px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            padding-left: 5px;
        }
        .form-control {
            width: 100%;
            border: none;
            outline: none;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 15px;
            box-shadow: var(--shadow-inset);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            box-shadow: var(--shadow-inset), 0 0 0 2px rgba(9, 132, 227, 0.2);
        }

        /* Buttons */
        .btn {
            width: 100%;
            border: none;
            outline: none;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 15px;
            box-shadow: var(--shadow-outset);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn:active {
            box-shadow: var(--shadow-inset);
            color: var(--accent);
        }
        .btn-primary {
            color: var(--accent);
        }
        .btn-danger {
            color: var(--danger);
        }

        /* List Tagihan */
        .list-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .list-item {
            background: var(--bg-color);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: var(--shadow-outset);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item .month {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .list-item .nominal {
            color: var(--accent);
            font-weight: 700;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--bg-color);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 15px rgba(163, 177, 198, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
        }
        .nav-item {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-item.active {
            color: var(--accent);
            box-shadow: var(--shadow-inset);
        }
        
        /* Utility */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1 id="header-title">Dashboard</h1>
    </header>

    <!-- VIEW: DASHBOARD -->
    <section id="view-dashboard" class="view active">
        <div class="card">
            <h2>Total Hutang</h2>
            <div class="amount" id="dash-total">Rp 0</div>
            <p style="color: var(--text-muted); font-size: 0.85rem;" id="dash-tenor">Tenor: 0 Bulan</p>
        </div>
        
        <div class="card" style="margin-top: 20px;">
            <h2>Tagihan Per Bulan</h2>
            <div class="amount" id="dash-perbulan" style="font-size: 1.6rem;">Rp 0</div>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Est. cicilan tetap bulanan</p>
        </div>
    </section>

    <!-- VIEW: TAGIHAN -->
    <section id="view-tagihan" class="view">
        <div id="tagihan-list" class="list-group">
            <!-- List dirender via JS -->
        </div>
    </section>

    <!-- VIEW: PENGATURAN -->
    <section id="view-pengaturan" class="view">
        <div class="card" style="text-align: left; padding: 20px;">
            <form id="form-pengaturan">
                <div class="form-group">
                    <label for="input-hutang">Jumlah Hutang (Rp)</label>
                    <input type="number" id="input-hutang" class="form-control" placeholder="Contoh: 10000000" required>
                </div>
                
                <div class="form-group">
                    <label for="input-tenor">Lama Tenor (Bulan)</label>
                    <input type="number" id="input-tenor" class="form-control" placeholder="Contoh: 12" required min="1" max="120">
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Kalkulasi
                </button>
            </form>
        </div>

        <button onclick="resetData()" class="btn btn-danger" style="margin-top: 10px;">
            <i class="fa-solid fa-trash-can"></i> Reset Semua Data
        </button>
    </section>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('dashboard', this)">
            <i class="fa-solid fa-chart-pie"></i>
        </button>
        <button class="nav-item" onclick="switchView('tagihan', this)">
            <i class="fa-solid fa-file-invoice-dollar"></i>
        </button>
        <button class="nav-item" onclick="switchView('pengaturan', this)">
            <i class="fa-solid fa-gear"></i>
        </button>
    </nav>
</div>

<script>
    // Konfigurasi State Format Rupiah
    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }).format(angka);
    };

    // State Management
    let appData = {
        totalHutang: 0,
        tenor: 0,
        perBulan: 0
    };

    // Inisialisasi Aplikasi
    function initApp() {
        const savedData = localStorage.getItem('debtAppData');
        if (savedData) {
            appData = JSON.parse(savedData);
        }
        updateUI();
        
        // Isi form dengan data yang ada
        if(appData.totalHutang > 0) {
            document.getElementById('input-hutang').value = appData.totalHutang;
            document.getElementById('input-tenor').value = appData.tenor;
        }
    }

    // Update Seluruh UI
    function updateUI() {
        // Update Dashboard
        document.getElementById('dash-total').innerText = formatRupiah(appData.totalHutang);
        document.getElementById('dash-tenor').innerText = `Tenor: ${appData.tenor} Bulan`;
        document.getElementById('dash-perbulan').innerText = formatRupiah(appData.perBulan);

        // Update List Tagihan
        const tagihanList = document.getElementById('tagihan-list');
        tagihanList.innerHTML = ''; // Bersihkan list

        if (appData.tenor === 0 || appData.totalHutang === 0) {
            tagihanList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-box-open"></i>
                    <p>Belum ada rincian tagihan. Silakan atur di menu Pengaturan.</p>
                </div>
            `;
            return;
        }

        // Generate Rincian Bulanan
        for (let i = 1; i <= appData.tenor; i++) {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="month">Bulan ke-${i}</div>
                <div class="nominal">${formatRupiah(appData.perBulan)}</div>
            `;
            tagihanList.appendChild(div);
        }
    }

    // Handle Form Submit
    document.getElementById('form-pengaturan').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const hutang = parseFloat(document.getElementById('input-hutang').value);
        const tenor = parseInt(document.getElementById('input-tenor').value);
        
        if (hutang > 0 && tenor > 0) {
            appData.totalHutang = hutang;
            appData.tenor = tenor;
            appData.perBulan = hutang / tenor;
            
            // Simpan ke Local Storage
            localStorage.setItem('debtAppData', JSON.stringify(appData));
            
            updateUI();
            
            // Berikan feedback visual pada tombol
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Tersimpan!';
            btn.style.color = '#00b894';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.color = 'var(--accent)';
            }, 2000);
        }
    });

    // Handle Reset Data
    function resetData() {
        if(confirm('Apakah Anda yakin ingin mereset seluruh data tagihan?')) {
            appData = { totalHutang: 0, tenor: 0, perBulan: 0 };
            localStorage.removeItem('debtAppData');
            document.getElementById('input-hutang').value = '';
            document.getElementById('input-tenor').value = '';
            updateUI();
            switchView('dashboard', document.querySelector('.nav-item')); // Kembali ke dashboard
        }
    }

    // Navigasi Bottom Nav
    function switchView(viewName, element) {
        // Update Nav Active State
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        // Update View Display
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${viewName}`).classList.add('active');

        // Update Header Title
        const titleMap = {
            'dashboard': 'Dashboard',
            'tagihan': 'Rincian Tagihan',
            'pengaturan': 'Pengaturan Sistem'
        };
        document.getElementById('header-title').innerText = titleMap[viewName];
    }

    // Jalankan inisialisasi saat web dimuat
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
